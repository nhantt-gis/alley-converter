version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Install dependencies with uv
    cmds:
      - uv sync

  run:
    desc: Run the converter CLI
    cmds:
      - uv run alley-converter {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  lint:
    desc: Run static checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format Python code
    cmds:
      - uv run ruff format .

  docker-build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  docker-run:
    desc: Run converter in Docker
    cmds:
      - docker compose run --rm alley-converter {{.CLI_ARGS}}

  clean:
    desc: Remove generated local artifacts
    cmds:
      - rm -rf .pytest_cache .ruff_cache data/*.gpkg
