[project]
name = "gtelmaps-alley-geodata-convert-tool"
version = "0.1.0"
description = "Convert CSV files with GeoJSON geometry columns into a GeoPackage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyogrio>=0.10.0",
    "pyproj>=3.7.0",
    "rich>=13.9.0",
    "shapely>=2.1.2",
    "typer>=0.12.5",
]

[project.scripts]
alley-converter = "alley_converter.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["alley_converter*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
